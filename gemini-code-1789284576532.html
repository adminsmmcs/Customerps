<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Contact Management</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Fonts: Sarabun -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- React & ReactDOM CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  
  <!-- Babel Standalone (สำหรับแปลง JSX ในเบราว์เซอร์) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body {
      font-family: 'Sarabun', sans-serif;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased selection:bg-blue-500 selection:text-white">
  
  <!-- Root Element สำหรับ React -->
  <div id="root"></div>

  <!-- React Application Script -->
  <script type="text/babel">
    const { useState, useEffect } = React;

    // ตัวเลือกช่องทางการติดต่อ พร้อมไอคอนและสีประจำช่องทาง
    const contactOptions = [
      { value: "ไม่ระบุ", label: "ไม่ระบุ", icon: "❓", color: "bg-gray-100 text-gray-600 border-gray-200" },
      { value: "โทรศัพท์", label: "โทรศัพท์", icon: "📞", color: "bg-blue-50 text-blue-700 border-blue-200" },
      { value: "Line", label: "Line", icon: "💬", color: "bg-emerald-50 text-emerald-700 border-emerald-200" },
      { value: "WhatsApp", label: "WhatsApp", icon: "📱", color: "bg-green-50 text-green-700 border-green-200" },
      { value: "We Chat", label: "We Chat", icon: "🗨️", color: "bg-teal-50 text-teal-700 border-teal-200" },
      { value: "SMS (ลูกค้าแจ้งชัดเจน)", label: "SMS (ลูกค้าแจ้งชัดเจน)", icon: "✉️", color: "bg-amber-50 text-amber-700 border-amber-200" },
      { value: "ไม่ทราบข้อมูล", label: "ไม่ทราบข้อมูล", icon: "🚫", color: "bg-rose-50 text-rose-700 border-rose-200" }
    ];

    // ข้อมูลตัวอย่าง (Mock Data)
    const initialData = [
      { id: "1", memberNumber: "9-006820104", status: "Potential", name: "ณภัทร กิมสื่อ", store: "20136 - Chachoengsao", staffName: "กิตติญา หอมบรรลือกิจ", staffId: "20027978", bucket: "Focus", contactPreference: "ไม่ระบุ" },
      { id: "2", memberNumber: "9-000579779", status: "Potential", name: "นลิศรา พิมห่วงศ์", store: "20136 - Chachoengsao", staffName: "กิตติญา หอมบรรลือกิจ", staffId: "20027978", bucket: "Focus", contactPreference: "ไม่ระบุ" },
      { id: "3", memberNumber: "9-005685219", status: "Potential", name: "นิภารัตน์ โชคประเสริฐ", store: "20136 - Chachoengsao", staffName: "สมชาย ใจดี", staffId: "20027979", bucket: "Focus", contactPreference: "ไม่ระบุ" },
      { id: "4", memberNumber: "9-008559711", status: "Potential", name: "จิราพร วงษ์สุวรรณ์", store: "20136 - Chachoengsao", staffName: "กิตติญา หอมบรรลือกิจ", staffId: "20027978", bucket: "Focus", contactPreference: "ไม่ระบุ" },
      { id: "5", memberNumber: "9-001704992", status: "Potential", name: "สุนทร วงษ์วัช", store: "20136 - Chachoengsao", staffName: "สมชาย ใจดี", staffId: "20027979", bucket: "Focus", contactPreference: "ไม่ระบุ" },
    ];

    // Google Apps Script Web App URL
    const API_URL = "https://script.google.com/macros/s/AKfycbyuVgeAWitw20q-0r8K9euHt6hehhVy2a86oXH8SMAXeytQL0rdQWGQAIjDMmKaWKUF/exec"; 

    function App() {
      const [customers, setCustomers] = useState(initialData);
      const [searchTerm, setSearchTerm] = useState('');
      const [selectedStaff, setSelectedStaff] = useState('All');
      const [notification, setNotification] = useState(null);
      const [isLoading, setIsLoading] = useState(false);

      // ดึงข้อมูลจาก Google Sheet เมื่อเริ่มต้นระบบ
      useEffect(() => {
        if (!API_URL) return;
        
        const fetchData = async () => {
          setIsLoading(true);
          try {
            const response = await fetch(API_URL);
            const data = await response.json();
            if (data && data.length > 0) {
              setCustomers(data);
            }
          } catch (error) {
            console.error("Error fetching data:", error);
            showNotification("⚠️ ไม่สามารถโหลดข้อมูลจาก Google Sheet ได้");
          } finally {
            setIsLoading(false);
          }
        };
        
        fetchData();
      }, []);

      const uniqueStaffNames = ['All', ...new Set(customers.map(c => c.staffName))];

      const showNotification = (msg) => {
        setNotification(msg);
        setTimeout(() => {
          setNotification(null);
        }, 2500);
      };

      const handlePreferenceChange = async (id, newPreference) => {
        const updatedUser = customers.find(c => c.id === id);
        const previousPreference = updatedUser.contactPreference;
        
        const updatedCustomers = customers.map(customer => {
          if (customer.id === id) {
            return { ...customer, contactPreference: newPreference };
          }
          return customer;
        });
        setCustomers(updatedCustomers);
        
        if (API_URL) {
          showNotification(`กำลังบันทึกข้อมูลของ ${updatedUser.name}...`);
          try {
            await fetch(API_URL, {
              method: 'POST',
              headers: { 'Content-Type': 'text/plain;charset=utf-8' },
              body: JSON.stringify({
                id: id,
                contactPreference: newPreference
              })
            });
            showNotification(`✅ บันทึกข้อมูล ${updatedUser.name} ลง Sheet สำเร็จ`);
          } catch (error) {
            console.error("Error updating data:", error);
            setCustomers(customers.map(c => c.id === id ? { ...c, contactPreference: previousPreference } : c));
            showNotification("❌ เกิดข้อผิดพลาดในการบันทึกข้อมูล");
          }
        } else {
          showNotification(`อัปเดตข้อมูลของ ${updatedUser.name} เรียบร้อย (Demo Mode)`);
        }
      };

      const filteredCustomers = customers.filter(customer => {
        const matchesSearch = customer.name.toLowerCase().includes(searchTerm.toLowerCase()) || customer.memberNumber.includes(searchTerm);
        const matchesStaff = selectedStaff === 'All' || customer.staffName === selectedStaff;
        return matchesSearch && matchesStaff;
      });

      const completedCount = filteredCustomers.filter(c => c.contactPreference !== "ไม่ระบุ").length;
      const totalCount = filteredCustomers.length;
      const progressPercentage = totalCount > 0 ? Math.round((completedCount / totalCount) * 100) : 0;

      return (
        <div className="min-h-screen pb-12">
          {/* Top Header & App Bar */}
          <header className="sticky top-0 z-20 bg-white/95 backdrop-blur-md border-b border-slate-200/85 shadow-sm">
            <div className="max-w-md mx-auto px-4 py-3.5">
              <div className="flex items-center justify-between gap-2 mb-3">
                <div className="flex items-center space-x-2.5">
                  <div className="w-9 h-9 rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-500 flex items-center justify-center text-white shadow-md shadow-blue-500/20">
                    <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z" />
                    </svg>
                  </div>
                  <div>
                    <h1 className="text-lg font-bold text-slate-900 leading-none">Customer Contact</h1>
                    <p className="text-[11px] text-slate-400 font-medium mt-0.5">ระบบจัดการช่องทางติดต่อลูกค้า</p>
                  </div>
                </div>

                <div className="flex flex-col items-end">
                  <span className="text-[10px] font-bold tracking-wider uppercase text-slate-400">ความคืบหน้า</span>
                  <div className="flex items-center gap-1.5 mt-0.5">
                    <span className={`text-xs px-2.5 py-0.5 rounded-full font-bold shadow-sm transition-colors ${
                      progressPercentage === 100 ? 'bg-emerald-500 text-white' : 'bg-blue-50 text-blue-700 border border-blue-200'
                    }`}>
                      {completedCount} / {totalCount} ({progressPercentage}%)
                    </span>
                  </div>
                </div>
              </div>

              <div className="w-full bg-slate-100 rounded-full h-1.5 overflow-hidden mb-3">
                <div className="bg-gradient-to-r from-blue-500 to-indigo-600 h-1.5 rounded-full transition-all duration-500 ease-out" style={{ width: `${progressPercentage}%` }} />
              </div>

              {isLoading && (
                 <div className="mb-3 text-center">
                   <span className="inline-flex items-center text-xs font-semibold text-blue-600 bg-blue-50 px-3 py-1 rounded-full animate-pulse">
                     <svg className="animate-spin -ml-1 mr-2 h-3 w-3 text-blue-600" fill="none" viewBox="0 0 24 24"><circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle><path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                     กำลังโหลดข้อมูลจาก Google Sheet...
                   </span>
                 </div>
              )}

              <div className="grid grid-cols-12 gap-2">
                <div className="col-span-5 relative">
                  <select
                    className="w-full pl-3 pr-7 py-2 text-xs font-semibold bg-slate-100/80 border border-slate-200/90 rounded-xl text-slate-700 appearance-none focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all cursor-pointer truncate"
                    value={selectedStaff}
                    onChange={(e) => setSelectedStaff(e.target.value)}
                  >
                    {uniqueStaffNames.map(staff => (
                      <option key={staff} value={staff}>
                        {staff === 'All' ? '👤 พนักงานทั้งหมด' : `👤 ${staff.split(' ')[0]}`}
                      </option>
                    ))}
                  </select>
                  <div className="absolute inset-y-0 right-0 flex items-center pr-2 pointer-events-none text-slate-400">
                    <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M19 9l-7 7-7-7" /></svg>
                  </div>
                </div>

                <div className="col-span-7 relative">
                  <input
                    type="text"
                    className="w-full pl-8 pr-3 py-2 text-xs font-medium bg-slate-100/80 border border-slate-200/90 rounded-xl text-slate-800 placeholder-slate-400 focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all"
                    placeholder="ค้นหาชื่อ หรือ รหัสสมาชิก..."
                    value={searchTerm}
                    onChange={(e) => setSearchTerm(e.target.value)}
                  />
                  <div className="absolute inset-y-0 left-0 pl-2.5 flex items-center pointer-events-none text-slate-400">
                    <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /></svg>
                  </div>
                </div>
              </div>
            </div>
          </header>

          <main className="max-w-md mx-auto px-4 pt-4 space-y-3">
            {filteredCustomers.length > 0 ? (
              filteredCustomers.map((customer) => (
                <CustomerCard 
                  key={customer.id} 
                  customer={customer} 
                  onPreferenceChange={handlePreferenceChange} 
                />
              ))
            ) : (
              <div className="bg-white rounded-2xl p-8 text-center border border-slate-200/70 shadow-sm my-6">
                <div className="w-12 h-12 bg-slate-100 rounded-full flex items-center justify-center mx-auto mb-3 text-slate-400">
                  <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9.172 9.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                </div>
                <p className="text-sm font-semibold text-slate-600">ไม่พบรายชื่อลูกค้าที่ค้นหา</p>
                <p className="text-xs text-slate-400 mt-1">ลองเปลี่ยนคำค้นหาหรือเลือกพนักงานคนอื่น</p>
              </div>
            )}
          </main>

          {notification && (
            <div className="fixed bottom-5 left-1/2 transform -translate-x-1/2 bg-slate-900/90 text-white text-xs font-medium px-4 py-2.5 rounded-full shadow-lg backdrop-blur-md z-50 flex items-center space-x-2 border border-slate-700">
              <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
              <span>{notification}</span>
            </div>
          )}
        </div>
      );
    }

    function CustomerCard({ customer, onPreferenceChange }) {
      const isCompleted = customer.contactPreference !== "ไม่ระบุ";
      const selectedOption = contactOptions.find(o => o.value === customer.contactPreference) || contactOptions[0];

      return (
        <div className={`bg-white rounded-2xl p-4 border transition-all duration-200 shadow-sm hover:shadow-md ${
          isCompleted ? 'border-emerald-200/90 ring-1 ring-emerald-500/10' : 'border-slate-200/80'
        }`}>
          <div className="flex justify-between items-start gap-2 mb-2.5">
            <div>
              <h2 className="text-base font-bold text-slate-900 leading-tight">
                {customer.name}
              </h2>
              <div className="flex items-center gap-2 mt-1">
                <span className="text-[11px] font-mono font-medium text-slate-500 bg-slate-100 px-1.5 py-0.5 rounded-md border border-slate-200/60">
                  ID: {customer.memberNumber}
                </span>
                <span className="text-[10px] font-semibold text-amber-700 bg-amber-50 px-1.5 py-0.5 rounded border border-amber-200">
                  {customer.status}
                </span>
              </div>
            </div>

            <span className="inline-flex items-center px-2 py-0.5 rounded-md text-[10px] font-bold bg-indigo-50 text-indigo-600 border border-indigo-100">
              {customer.bucket}
            </span>
          </div>

          <div className="grid grid-cols-2 gap-2 text-[11px] bg-slate-50/70 p-2.5 rounded-xl border border-slate-100 mb-3">
            <div>
              <span className="text-slate-400 font-normal block">สาขา</span>
              <span className="font-semibold text-slate-700 truncate block">{customer.store}</span>
            </div>
            <div>
              <span className="text-slate-400 font-normal block">พนักงาน (PS Sep 26)</span>
              <span className="font-semibold text-slate-700 truncate block">{customer.staffName}</span>
            </div>
          </div>

          <div>
            <label className="block text-[11px] font-bold text-slate-500 mb-1.5 uppercase tracking-wide">
              ช่องทางที่สะดวกให้ติดต่อ
            </label>
            <div className="relative">
              <select
                className={`w-full pl-9 pr-8 py-2.5 text-xs font-semibold rounded-xl border appearance-none focus:outline-none focus:ring-2 transition-all cursor-pointer ${
                  isCompleted 
                    ? 'bg-emerald-50/40 text-emerald-900 border-emerald-300 focus:ring-emerald-500/20 focus:border-emerald-500' 
                    : 'bg-white text-slate-700 border-slate-200 hover:border-slate-300 focus:ring-blue-500/20 focus:border-blue-500'
                }`}
                value={customer.contactPreference}
                onChange={(e) => onPreferenceChange(customer.id, e.target.value)}
              >
                {contactOptions.map((opt) => (
                  <option key={opt.value} value={opt.value}>
                    {opt.icon} {opt.label}
                  </option>
                ))}
              </select>

              <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-sm">
                <span>{selectedOption.icon}</span>
              </div>

              <div className="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none text-slate-400">
                <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M19 9l-7 7-7-7" /></svg>
              </div>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
